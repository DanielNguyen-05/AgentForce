[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentforce-aic"
version = "0.1.0"
description = "Multimodal video retrieval pipeline for AIC 2026"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.1"]
phowhisper = [
  "faster-whisper>=1.1",
  "ctranslate2>=4.5",
  "transformers[torch]>=4.41,<6",
  "accelerate>=1.0",
]
gemini = ["google-genai>=1.0"]
semantic = ["sentence-transformers>=3.0"]
vision = ["open-clip-torch>=2.30", "torch>=2.2", "Pillow>=10"]
faiss = ["faiss-cpu>=1.8"]
ocr = ["pytesseract>=0.3.13", "Pillow>=10"]
easyocr = ["easyocr>=1.7"]
video = ["opencv-python>=4.10"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.9"]
all = [
  "faster-whisper>=1.1",
  "ctranslate2>=4.5",
  "transformers[torch]>=4.41,<6",
  "accelerate>=1.0",
  "google-genai>=1.0",
  "sentence-transformers>=3.0",
  "open-clip-torch>=2.30",
  "faiss-cpu>=1.8",
  "pytesseract>=0.3.13",
  "easyocr>=1.7",
  "Pillow>=10",
  "opencv-python>=4.10",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["audio_to_json.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
